<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>增删改查</title>
  <style>
    table{
      border-collapse: collapse;
    }
    td,th{
      border: 1px solid #ddd;
      padding: 2px 10px;
    }
  </style>
</head>
<body>
  <div id="app">
    <table>
      <thead>
        <tr>
          <th>编号</th>
          <th>姓名</th>
          <th>密码</th>
          <th>年龄</th>
          <th>电话</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(item) in users" :key="item.id">
          <td>{{item.id}}</td>
          <td>{{item.name}}</td>
          <td>{{item.password}}</td>
          <td>{{item.age}}</td>
          <td>{{item.tel}}</td>
          <td>
            <button @click="editUser(item.id)">编辑</button>
            <button @click="delUser(item.id)">删除</button>
          </td>
        </tr>
      </tbody>
    </table>
    <table>
      <tr>
        <td>姓名：</td>
        <td><input type="text" v-model="user.name"></td>
      </tr>
      <tr>
        <td>密码：</td>
        <td><input type="text" v-model="user.password"></td>
      </tr>
      <tr>
        <td>年龄：</td>
        <td><input type="text" v-model.number="user.age"></td>
      </tr>
      <tr>
        <td>电话：</td>
        <td><input type="text" v-model="user.tel"></td>
      </tr>
      <tr>
        <td></td>
        <td>
          <button v-if="user.id" @click="upUser">修改</button>
          <button v-else @click="addUser">添加</button>
          <button @click="cancel">取消</button>
        </td>
      </tr>
    </table>
  </div>
  <script src="./js/vue.js"></script>
  <script src="./js/axios.min.js"></script>
  <script>
    new Vue({
      el:'#app',
      data:{
        // 用户数组
        users:[],
        // 用户
        user:{
          name:'',
          password:'',
          age:'',
          tel:''
        }
      },
      methods: {
        // 查询全部用户
        loadAllUser(){
          axios.get('/users/findAll').then(({data})=>{
            this.users = data
          })
        },
        // 添加用户
        addUser(){
          if(Object.keys(this.user).some(k=>!this.user[k])){
            return alert('请输入完整信息！')
          }
          axios.post('/users/add',this.user).then(({data})=>{
            if(data>0){
              alert('添加成功！')
              // 重新加载用户列表
              this.loadAllUser()
            }
          })
        },
        // 删除用户
        delUser(id){
          if(confirm('确定删除吗？')){
            axios.delete('/users/del/'+id).then(({data})=>{
              if(data>0){
                alert('删除成功！')
                // 重新加载用户列表
                this.loadAllUser()
              }
            })
          }
        },
        // 编辑用户
        editUser(id){
          axios.get('/users/findById',{
            params:{
              id
            }
          }).then(({data})=>{
            this.user = data
          })
        },
        // 修改用户
        upUser(){
          if(Object.keys(this.user).some(k=>!this.user[k])){
            return alert('请输入完整信息！')
          }
          // 修改用户
          axios.put('/users/up',this.user).then(({data})=>{
            if(data>0){
              alert('修改成功！')
              // 刷新用户列表
              this.loadAllUser()
            }
          })
        },
        // 取消方法
        cancel(){
          this.user = {
            name:'',
            password:'',
            age:'',
            tel:''
          }
        }
      },
      mounted() {
        // 加载全部用户
        this.loadAllUser()
      },
    })
  </script>
</body>
</html>
