<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分页查询</title>
  <style>
    table{
      border-collapse: collapse;
    }
    td,th{
      border: 1px solid #ddd;
      padding: 2px 10px;
    }
  </style>
</head>
<body>
<div id="app">
  <table>
    <thead>
    <tr>
      <th>编号</th>
      <th>姓名</th>
      <th>密码</th>
      <th>年龄</th>
      <th>电话</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr v-for="(item) in users" :key="item.id">
      <td>{{item.id}}</td>
      <td>{{item.name}}</td>
      <td>{{item.password}}</td>
      <td>{{item.age}}</td>
      <td>{{item.tel}}</td>
      <td>
        <button @click="editUser(item.id)">编辑</button>
        <button @click="delUser(item.id)">删除</button>
      </td>
    </tr>
    </tbody>
    <tfoot>
    <tr>
      <td colspan="6">
        <button @click="current=1" :disabled="current==1">首页</button>
        <button @click="current--" :disabled="current==1">上一页</button>
        <span>{{current}}</span>
        <span>/</span>
        <span>{{pages}}</span>
        <button @click="current++" :disabled="current==pages">下一页</button>
        <button @click="current=pages" :disabled="current==pages">尾页</button>
        <span>显示数量：</span>
        <select v-model="size">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </td>
    </tr>
    </tfoot>
  </table>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script>
  new Vue({
    el:'#app',
    data:{
      // 用户数组
      users:[],
      // 总页数
      pages:0,
      // 请求页
      current:1,
      // 每页数量
      size:5,
    },
    watch:{
      // 监听页码是否发生变化
      current(){
        this.loadUsers();
      },
      // 监听总页数是否发生变化
      size(){
        this.current = 1
        this.loadUsers();
      }
    },
    methods: {
      // 加载用户信息
      loadUsers(){
        axios.get('/users/findPage',{
          params:{
            current: this.current,
            size:this.size
          }
        }).then(({data:{pages,rows}})=>{
          this.users = rows;
          this.pages = pages;
        })
      }
    },
    mounted() {
      this.loadUsers();
    },
  })
</script>
</body>
</html>
