<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下载资源</title>
</head>
<body>
  <h2>一只可爱的小狗</h2>
  <!-- 使用a标签的href属性，指定下载的资源地址
   使用download属性设置下载完成后资源的名称 -->
  <a href="download" download="小狗.png">点击下载高清图片</a>
</body>
</html>
