<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生管理</title>
  <style>
    .search{
      padding: 10px;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
    }
    .search input{
      width: 300px;
    }
    .search button{
      padding: 2px 10px;
      margin-left: 10px;
    }
    table{
      border-collapse: collapse;
    }
    td,th{
      border: 1px solid #ccc;
      padding: 2px 20px;
    }
  </style>
</head>
<body>
  <div class="search">
    <span>学生姓名(模糊查询)：</span>
    <input type="text" id="studentName">
    <button id="find">查询</button>
    <a href="addStudent.html">添加学生</a>
  </div>
  <hr>
  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>性别</th>
        <th>电话</th>
        <th>年级</th>
        <th>生日</th>
        <th>地址</th>
      </tr>
    </thead>
    <tbody id="tbody">

    </tbody>
  </table>

  <script src="./js/bing.js"></script>
  <script>
    // 查询按钮点击事件
    document.querySelector('#find').onclick = function(){
      loadStudents()
    }
    // 加载学生列表的方法
    function loadStudents(){
      // 获取学生的姓名
      let studentName = document.querySelector('#studentName').value;
      let xhr = new XMLHttpRequest();
      // 这里需要传递GET请求参数
      // GET请求参数，直接拼接在URL地址上，使用?拼接URL参数，多个参数使用&拼接
      xhr.open('GET','student?studentName='+studentName);
      xhr.send()
      xhr.onreadystatechange = function(){
        if(xhr.readyState===4){
          if(xhr.status===200){
            // 将json格式的字符串转js对象，这里返回的是js数组
            let stus = JSON.parse(xhr.response)
            let str = '';
            // 遍历学生数组，将每个学生对象拼接成html结构
            stus.forEach(s=>{
              s.bornDate = miniDate(new Date(s.bornDate))
              str += `
                <tr>
                  <td>${s.studentNo}</td>
                  <td>${s.studentName}</td>
                  <td>${s.sex}</td>
                  <td>${s.phone}</td>
                  <td>${s.gradeId}</td>
                  <td>${s.bornDate}</td>
                  <td>${s.address}</td>
                </tr>
              `
            })
            // 在tbody中展示学生列表信息
            document.querySelector('#tbody').innerHTML = str
          }
        }
      }
    }
    // 执行一下加载学生列表的方法
    loadStudents()
  </script>
</body>
</html>
