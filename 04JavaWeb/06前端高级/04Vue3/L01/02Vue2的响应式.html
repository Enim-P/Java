<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue2的响应式</title>
</head>
<body>
  <div id="app1">
    <h2>Vue2的响应式</h2>
    <div>学生：{{stu}}</div>
    <div>
      <button @click="upAge">age++</button>
      <button @click="addSex">添加性别</button>
      <button @click="delName">删除姓名</button>
    </div>
    <div>食物：{{foods}}</div>
    <div>
      <button @click="addFood">添加食物</button>
    </div>
  </div>
  
  <!-- 引入Vue2 -->
  <script src="./js/vue.js"></script>
  <script>
    new Vue({
      el:'#app1',
      data:{
        stu:{
          name:'张三',
          age:20
        },
        foods:['苹果','西瓜','香蕉','葡萄']
      },
      methods: {
        upAge(){
          // 年龄更新后，页面自动刷新
          this.stu.age++
        },
        addSex(){
          // 给某个对象添加属性，不会立刻触发响应式
          // this.stu.sex = '女'
          // Vue2提供了$set方法，添加属性
          this.$set(this.stu,'sex','女')
        },
        delName(){
          // 删除某个对象的属性，不会立刻触发响应式
          // delete this.stu.name;
          // Vue2提供了$delete方法，删除属性
          this.$delete(this.stu,'name')
        },
        addFood(){
          // 根据数组的下标操作数组，不会立刻触发响应式
          // this.foods[this.foods.length] = "奶茶"
          // Vue2通过$set方法操作数组的索引
          this.$set(this.foods,this.foods.length,'奶茶')
        }
      },
    })
    
  </script>
</body>
</html>
