<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发送请求</title>
  <style>
    table {
      border-collapse: collapse;
    }

    td,
    th {
      border: 1px solid #ccc;
      padding: 1px 20px;
    }
  </style>
</head>

<body>
  <div id="app">
    <div>
      <span>年级：</span>
      <select v-model="gradeId">
        <option v-for="(item,index) in grades" 
        :key="index" :value="item.gradeId">{{item.gradeName}}</option>
      </select>
      <span>名称：</span>
      <input type="text" v-model="subjectName">
      <button @click="find">查询</button>
    </div>
    <hr>
    <table>
      <thead>
        <tr>
          <th>编号</th>
          <th>名称</th>
          <th>课时</th>
          <th>年级</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(item,index) in subjects" :key="index">
          <td>{{item.subjectId}}</td>
          <td>{{item.subjectName}}</td>
          <td>{{item.classHour}}</td>
          <td>{{item.grade.gradeName}}</td>
          <td>
            <button @click="editSubject(item.subjectId)">编辑</button>
            <button @click="delSubject(item.subjectId)">删除</button>
          </td>
        </tr>
      </tbody>
      <tbody>
        <tr>
          <td colspan="5">
            <button @click="pageIndex=1" :disabled="pageIndex==1">首页</button>
            <button @click="pageIndex--" :disabled="pageIndex==1">上一页</button>
            <span>{{pageIndex}}</span>
            <span>/</span>
            <span>{{totalPage}}</span>
            <button @click="pageIndex++" :disabled="pageIndex==totalPage">下一页</button>
            <button @click="pageIndex=totalPage" :disabled="pageIndex==totalPage">尾页</button>
          </td>
        </tr>
      </tbody>
    </table>
    <hr>
    <table>
      <tr>
        <td>课程名称</td>
        <td><input type="text" v-model="subject.subjectName"></td>
      </tr>
      <tr>
        <td>课程课时：</td>
        <td><input type="text" v-model="subject.classHour"></td>
      </tr>
      <tr>
        <td>所属年级</td>
        <td>
          <select v-model="subject.gradeId">
            <option v-for="(item,index) in grades" 
            :key="index" :value="item.gradeId">{{item.gradeName}}</option>
          </select>
        </td>
      </tr>
      <tr>
        <td></td>
        <td>
          <button v-if="subject.subjectId>0" @click="upSubject">修改</button>
          <button v-else @click="addSubject">添加</button>
          <button @click="cancel">取消</button>
        </td>
      </tr>
    </table>
  </div>
  <!-- 引入vue -->
  <script src="../JS/vue.min.js"></script>
  <!-- 引入axios -->
  <script src="../JS/axios.min.js"></script>
  <script>
    new Vue({
      el: '#app',
      data: {
        // 页码
        pageIndex: 1,
        // 每页数量
        pageSize: 5,
        // 年级编号（用于查询）
        gradeId:0,
        // 课程名称（用于查询）
        subjectName:'',
        // 年级数组
        grades: [],
        // 课程数组
        subjects: [],
        // 总数量
        total: 0,
        // 课程对象
        subject:{
          subjectId:0,
          subjectName:'',
          classHour:0,
          gradeId:0
        }
      },
      methods: {
        // 删除课程
        async delSubject(subjectId){
          if(confirm('确定删除吗？')){
            let {data} = await axios.delete('http://localhost:8081/subjects/'+subjectId)
            if(data.code==1){
              alert('删除成功！')
              this.loadSubjects()  // 重新加载课程信息
            }
          }
        },
        // 修改课程
        async upSubject(){
          if(!this.subject.subjectName){
            return alert('请输入课程名称！')
          }
          if(this.subject.gradeId==0){
            return alert('请选择年级！')
          }
          let {data} = await axios.put('http://localhost:8081/subjects',this.subject)
          if(data.code==1){
            alert('修改成功！')
            this.loadSubjects()  // 重新加载课程信息
          }
        },
        // 编辑课程
        async editSubject(subjectId){
          let {data:{data}} = await axios.get('http://localhost:8081/subjects/'+subjectId)
          this.subject = data;
        },
        // 添加课程
        async addSubject(){
          if(!this.subject.subjectName){
            return alert('请输入课程名称！')
          }
          if(this.subject.gradeId==0){
            return alert('请选择年级！')
          }
          let {data} = await axios.post('http://localhost:8081/subjects',this.subject)
          if(data.code==1){
            alert('添加成功！')
            this.loadSubjects()  // 重新加载课程信息
          }
        },
        // 取消方法
        cancel(){
          this.subject = {
            subjectId:0,
            subjectName:'',
            classHour:0,
            gradeId:0
          }
        },
        // 查询方法
        find(){
          this.pageIndex = 1;   // 页码回到1
          this.loadSubjects();  // 重新加载课程信息
        },
        // 加载年级列表
        async loadGrades() {
          // 发送请求拿到年级数据
          let { data: { data } } = await axios.get('http://localhost:8081/grades')
          // 添加一个请选择年级
          data.unshift({gradeId:0,gradeName:'请选择年级'});
          this.grades = data
        },
        // 加载课程列表
        async loadSubjects() {
          let { data: { data: { rows, total } } } = await axios.get('http://localhost:8081/subjects', {
            params: {
              pageIndex: this.pageIndex,
              pageSize: this.pageSize,
              gradeId:this.gradeId,
              subjectName:this.subjectName
            }
          })
          this.subjects = rows
          this.total = total
        }
      },
      computed: {
        // 总页数
        totalPage() {
          return Math.ceil(this.total / this.pageSize);
        }
      },
      watch: {
        // 监听页码
        pageIndex() {
          this.loadSubjects()  //重新加载数据
        }
      },
      // 页面挂载完成
      mounted() {
        this.loadGrades()   // 加载年级
        this.loadSubjects() // 加载课程
      },
    })
  </script>
</body>

</html>
