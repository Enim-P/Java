<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>绑定样式</title>
  <style>
    .a{
      border: 1px solid black;
      padding: 10px;
      width: 200px;
      height: 200px;
    }
    .b{
      color: red;
    }
    .c{
      font-size: 30px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div>
      <button @click="classObj.a=!classObj.a">添加边框</button>
      <button @click="classObj.b=!classObj.b">添加颜色</button>
      <button @click="classObj.c=!classObj.c">添加大小</button>
    </div>
    <hr>
    <!-- class属性可以绑定一个对象，对象的属性名是css选择器名称，属性值是bool值 -->
    <div :class="classObj">class绑定一个对象</div>
    <hr>
    <button @click="isA=!isA">添加边框</button>
    <button @click="isB=!isB">添加颜色</button>
    <button @click="isC=!isC">添加大小</button>
    <hr>
    <!-- class属性可以绑定一个数组，数组中定义条件表达式控制样式 -->
    <div :class="[isA?'a':'',isB&&'b',isC&&'c']">class绑定一个数组</div>
    <hr>
    <button @click="styleObj.color='blue'">更换颜色</button>
    <hr>
    <!-- style属性可以绑定一个对象，对象的属性就是css样式的属性，采用小驼峰命名 -->
    <div :style="styleObj">style绑定对象</div>
  </div>
  <script src="../JS/vue.min.js"></script>
  <script>
    new Vue({
      el:'#app',
      data:{
        styleObj:{
          fontSize:'30px',
          color:'red',
          width:'200px',
          height:'200px',
          backgroundColor:'lightblue'
        },
        classObj:{
          a:false,
          b:false,
          c:false
        },
        isA:false,
        isB:false,
        isC:false
      }
    })
  </script>
</body>
</html>
