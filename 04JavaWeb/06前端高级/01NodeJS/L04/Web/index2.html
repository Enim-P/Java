<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jquery-ajax</title>
  <style>
    table{
      border-collapse: collapse;
    }
    td,th{
      border: 1px solid #ccc;
      padding: 2px 20px;
    }
  </style>
</head>
<body>
  <div>
    姓名：
    <input type="text">
    <button>搜索</button>
  </div>
  <hr>

  <table>
    <thead>
      <tr>
        <th>编号</th>
        <th>姓名</th>
        <th>性别</th>
        <th>年龄</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="tbody">
     
    </tbody>
    <tfoot>
      <tr>
        <td colspan="5">
          <button>首页</button>
          <button>上一页</button>
          <span>1</span>
          <span>/</span>
          <span>5</span>
          <button>下一页</button>
          <button>尾页</button>
        </td>
      </tr>
    </tfoot>
  </table>
  <hr>
  <table>
    <tr>
      <td>编号：</td>
      <td><input type="text" id="id"></td>
    </tr>
    <tr>
      <td>姓名：</td>
      <td><input type="text" id="name"></td>
    </tr>
    <tr>
      <td>性别：</td>
      <td><input type="text" id="sex"></td>
    </tr>
    <tr>
      <td>年龄：</td>
      <td><input type="text" id="age"></td>
    </tr>
    <tr>
      <td></td>
      <td>
        <button id="update" style="display: none;">修改</button>
        <button id="add">添加</button>
        <button id="cancel">取消</button>
      </td>
    </tr>
  </table>
  <!-- 引入jquery库 -->
  <script src="./js/jquery.min.js"></script>
  <script>

    function $r(select){
      return document.querySelector(select);
    }

    // 取消按钮点击事件
    $r('#cancel').onclick = function(){
      $r("#id").value = ""
      $r("#name").value = ""
      $r("#sex").value = ""
      $r("#age").value = ""
      // 编号文本框取消禁用
      $r("#id").removeAttribute("disabled");
      // 显示添加按钮 隐藏修改按钮
      $r("#add").style.display = "inline"
      $r("#update").style.display = "none"
    }

    // 修改按钮点击事件
    $r("#update").onclick = function(){
      // 获取学生数据
      let id = $r("#id").value;
      let name = $r("#name").value;
      let sex = $r("#sex").value;
      let age = $r("#age").value;
      // 将数据组织成一个对象
      let stu = {id,name,sex,age};

      //jquery封装了get和post方法，没有封装put和delete方法
      //如果要发送put和delete请求，需要使用通用的ajax方法
      $.ajax({
        url:'http://127.0.0.1:5200/update',  // 请求地址
        method:'PUT',  // 请求方式
        data:stu,  // 请求参数
        // 请求成功后的回调
        success:(res)=>{
          alert(res.message)
          if(res.code==1){
            loadStus()   // 重新加载学生信息
          }
        }
      })
    }

    // 添加按钮点击事件
    $r('#add').onclick = function(){
      // 获取学生数据
      let id = $r("#id").value;
      let name = $r("#name").value;
      let sex = $r("#sex").value;
      let age = $r("#age").value;
      // 将数据组织成一个对象
      let stu = {id,name,sex,age};
      $.post('http://127.0.0.1:5200/add',stu,(res)=>{
        alert(res.message)
          if(res.code==1){
            loadStus()   // 重新加载学生信息
          }
      })
    }
    
    // 加载学生信息的方法
    function loadStus(){
      $.get('http://127.0.0.1:5200/list',(stus)=>{
        let str = '';
            stus.forEach(s=>{
              str += `
                 <tr>
                  <td>${s.id}</td>
                  <td>${s.name}</td>
                  <td>${s.sex}</td>
                  <td>${s.age}</td>
                  <td>
                    <button onclick="edit(${s.id})">编辑</button>  
                    <button onclick="del(${s.id})">删除</button>  
                  </td>
                </tr>
              `;
            })
            document.querySelector("#tbody").innerHTML = str;
      })
    }

    // 删除方法
    function del(id){
      if(confirm('确定删除吗？')){
        $.ajax({
          url:'http://127.0.0.1:5200/delete',
          method:'DELETE',
          data:{id},
          success:(res)=>{
            alert(res.message)
            if(res.code==1){
              loadStus()  //重新加载学生信息
            }
          }
        })
      }
    }

    // 编辑方法
    function edit(id){
      $.get('http://127.0.0.1:5200/one',{id},(stu)=>{
        //编号文本框禁用
        $r("#id").setAttribute("disabled",true);
        $r("#id").value = stu.id
        $r("#name").value = stu.name
        $r("#sex").value = stu.sex
        $r("#age").value = stu.age
        // 显示修改按钮 隐藏添加按钮
        $r("#update").style.display = "inline"
        $r("#add").style.display = "none"
      })
    }

    loadStus()  // 调用加载学生信息的方法
  </script>
</body>
</html>
