<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>申请表</title>
</head>
<body>
  <p>
    <h2>申请表</h2>
  </p>
  <p>姓名：
    <input type = "text" >
  </p>
  <p>密码：
    <input type = "password">
  </p>
   <p>照片：
    <input type ="file">
   </p>
   <p>感兴趣的职位：
    <input type = "radio" name = "job">Web设计
    <input type = "radio" name = "job">Web开发
   </p>
   <p>向往的城市:
    <select>
      <option checked>-请选择-</option>
      <option>-北京-</option>
      <option>-上海-</option>
    </select>
   </p>
   <P>协议：</P>
   <p>
    <textarea row = "5" cols = "50" readonly>求职信息必须真实，准确。本网站只负责向企业推荐。</textarea>
   </P>
   <p>
    <input type = "checkbox"> 我认真阅读并接受以上的协议
   </p>
   <p>经验：</p>
   <p>
    <select>
      <option>-请选择-</option>
      <option>-html-</option>
      <option>-java-</option>
    </select>
   </p>
   <p>
    <button disabled>提交</button>
    <button type ="reset">重置</button>
   </p>
</body>
</html>
