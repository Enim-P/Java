<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>列表和表格</title>
  <style>

    table{
        border-collapse : collapse;
    }

  </style>
</head>
<body>
  <!-- 有序标签 -->
  <h2>Apex Legends</h2>
  <ol type = "I">
    <li>探路者</li>
    <li>恶灵小姐</li>
    <li>沃特森</li>
    <li>侵蚀</li>
  </ol>
  <!-- square , disc, circle -->
  <ul type = "square" >
    <li>探路者</li>
    <li>恶灵小姐</li>
    <li>沃特森</li>
    <li>侵蚀</li>
  </ul>

  <dl>
    <dt>Apex Legends</dt>
    <dd>111</dd>
    <dd>222</dd>
    <dd>333</dd>
  </dl>
  <dl>
    <dt>333</dt>
    <dd>222</dd>
    <dd>222</dd>
    <dd>222</dd>
    <dd>222</dd>

    <dt>5555</dt>
    <dd>yubh</dd>
    <dd>yubh</dd>
    <dd>yubh</dd>
    <dd>yubh</dd>


  </dl>

  <table border = "1" width = "200" height = "200">
    <tr>
      <th>121</th>
      <th>456</th>
      <th>234</th>
    </tr>

    <tr>
      <td>ghj</td>
      <td>567</td>
      <td>frg</td>
    </tr>

    <tr>
      <td>r99</td>
      <td>lstare</td>
      <td>98k</td>
    </tr>
  </table>
<hr>
  <table border = "1" width = "300" height = "300" >
    <thead>
      <td>英雄传奇</td>
      <td>战斗位置</td>
      <td>英雄机能</td>
    </thead>
    <tbody>
      <tr>
      <td>探路者</td>
      <td>突击传奇</td>
      <td>抓钩</td>
      </tr>
      <tr>
      <td>沃特森</td>
      <td>控制传奇</td>
      <td>电网</td> 
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan = "3"> 欢迎来到Apex Legend</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
