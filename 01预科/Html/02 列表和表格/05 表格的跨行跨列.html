<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表格的跨行跨列</title>
</head>
<body>
  <!-- colspan属性用于跨列合并 
      rowspan 属性用于跨行合并-->
  <table border = "1" width = "200" height = "200">
    <tr>
      <td colspan = "2"></td>
  
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td></td>
      <td colspan = "3"></td>
    </tr>
    <tr>
      <td rowspan = "2"></td>
      <td></td>
      <td colspan = "2" rowspan = "2"></td>
  
    </td>
    <tr>
      <td></td>

    </tr>
  </table>
  <!-- 总结：表格单元格合并的步骤
   1. 先画出完整的表格
   2. 先跨列合并 colspan
   3. 再跨行合并 rowspan 
   -->
   <hr/>
   <table border = "1" width = "200" height = "200">
    <tr>
     <td rowspan = "3"></td>
     <td colspan = "2" style="width:50%;"></td>
     <td></td>
    </tr>

    <tr height = "100">
    <td colspan = "2" rowspan = "2" ></td>
    <td rowspan = "3"></td>
    </tr>

    <tr>
   
    </tr>

    <tr>
    <td></td>
    <td colspan = "2"></td>

  
    </tr>
   </table>
   <hr/>

   <table border = "1" width = "200" height = "200">
    <tr>
     <td colspan = "2"></td>
     <td></td>
     <td></td>
    </tr>

    <tr>
     <td></td>
     <td rowspan = "2"></td>
     <td colspan = "2" style ="width:50%;"></td>
    </tr>

    <tr>
     <td rowspan = "2"></td>
     <td colspan = "2"></td>
  
    </tr>

    <tr>
     <td colspan = "3"></td>
    </tr>
   </table>
</body>
</html>
