<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无序列表</title>
</head>
<body>
  <!--ul是无序列表标签，li是列表项标签 
  无序列表的列表项没有序号，但是有符号 -->
  <h3>今日特价水果</h3>  
  <ul>
    <li>苹果</li>
    <li>葡萄</li>
    <li>西瓜</li>
    <li>草莓</li>
  </ul> 
  <h3>热门旅游城市</h3>
<!-- 通过type属性设置有序列表的符号，属性值包括：disc(实心圆) circle(空心圆) square(实心正方形 ) -->
  <ul type = "square">
    <li>北京</li>
    <li>上海</li>
    <li>重庆</li>
    <li>成都</li>
  </ul>  
  
</body>
</html>
