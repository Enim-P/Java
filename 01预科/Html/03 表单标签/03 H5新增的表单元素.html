<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
</head>

<body>
  <form>
    <p>数字本文框：
      <!-- number 是数字文本框 只能输入数字
     max和min限制文本框的输入范围，step设置分割区间-->
      <input type="number" max="100" min="0" step="5">
    </p>

    <p>滑块：
      <!--range是滑块，也可以设置max, min , step  
    vlue属性默认值-->
      <imput type="range" max="100" min="0" step="5" value="30">
    </p>

    <p>网址本文框：
      <!-- url 是网址文本框，提交表单时，会对本文框中的内容进行验证
         网址的格式必须是http:/https:/ ftp: -->
      <input type="url">
    </p>

    <P>邮箱本文框：
      <!-- email是邮箱文本框，会对文本框中的内容进行验证，
       邮箱格式必须包含@ 符号 -->
      <imput type = "email">
    </P>

    <p>搜索文本框：
      <!-- search是搜索文本框，跟普通文本框的区别是自带一个清空小按钮 -->
      <imput type = "search">
    </p>

    <p>
      <!-- H5 中通过button 标签定义按钮，通过type属性设置按钮类型
       type属性的默认值是submit -->
      <button type ="submit" >提交按钮</button>
      <button type = "reset">重置按钮</button>
      <button type = "button">普通按钮</button>
  

    </p>
  </form>
</body>

</html>
