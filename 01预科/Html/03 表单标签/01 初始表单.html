<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初识表单</title>
</head>
<body>
  <!-- 表单元素的作用是：收集用户输入的内容，并向服务器提交
   form就是表单标签 
   action属性设置向服务器提交的地址
   method属性设置提交的方式（常用方式有post和get）-->
  <form action = "http://119.45.211.185:8001/Admin/Login"  method = "get">
    <!-- input是表单的元素标签，通过type属性设置元素类型 -->
    <p>账号:<input type = "text" name  = "loginId"></p>
    <p>密码：<input type = "password" name = "loginPwd"></p>
    <p>
      <input type = "submit" value = "登陆">
      <input type = "reset"  value = "取消">
    </p>
  </form>
</body>
</html>
