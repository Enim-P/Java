<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人人网注册页面</title>
</head>

<body>
  <!-- 表单元素可以不放在form中，此处就无法向服务器提交，
   如果只是绘制页面，不需要提交数据，可以省略form标签 -->
  <form>
    <p>
      <img src="./image/renren_titile.gif">
    </p>
    <p>人人网，中国 <strong>最真实、最有效</strong> 的社会平台，加入人人网，找回老朋友，结交新朋友。</p>
    <p>电子邮箱：<input type="text"></p>
    <p>设置密码：<input type="password"></p>
    <p>真实姓名：<input type="text"></p>
    <p>性别：
      <input type="radio" checked>男
      <input type="radio">女
    </p>
    <p>生日：
      <select>
        <option>1991</option>
        <option>1992</option>
      </select>年
      <select>
        <option>11</option>
        <option>12</option>
      </select>月
      <select>
        <option>29</option>
        <option selected>30</option>
      </select>
    </p>
    <p>为什么要填写我的生日？</p>
    <p>我现在：
      <select>
        <option>请选择身份</option>
        <option>学生</option>
        <option>工程师</option>
      </select>（非常重要）
    </p>
    <p>
      <img src="./image/renren_code.gif">
      <a href="#">看不清换一张？</a>
    </p>
    <p>验证：<input type="text"></p>
    <p>
      <input type="image" src="./image/renren.gif">
    </p>
  </form>
</body>

</html>
