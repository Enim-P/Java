<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>申请表</title>
</head>
<body>
  <h2>申请表</h2>
  <form>
    <p>姓名：<input type="text"></p>
    <p>密码：<input type="password"></p>
    <p>照片：<input type="file"></p>
    <p>感兴趣的职位：
      <input type="radio" name="job">Web设计
      <input type="radio" name="job">Web开发
    </p>
    <p>向往的城市：
      <select>
        <option>--请选择--</option>
        <option>南京</option>
        <option>杭州</option>
        <option>合肥</option>
      </select>
    </p>
    <p>协议：<br>
      <textarea readonly rows="5" cols="30">求职信息必须真实，准确。本网站只负责向企业推荐。</textarea>
    </p>
    <p>
      <input type="checkbox">
      我认真阅读并接受以上的协议。
    </p>
    <p>经验：<br>
      <select>
        <option>--请选择--</option>
        <option>一年</option>
        <option>二年</option>
        <option>三年</option>
      </select>
    </p>
    <p>
      <button disabled type="submit">提交</button>
      <button type="reset">重置</button>
    </p>
  </form>
</body>
</html>
