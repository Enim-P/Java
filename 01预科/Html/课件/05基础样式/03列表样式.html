<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>列表样式</title>
  <style>
    li{
      /* 设置列表符号的样式，属性值none表示空，没有列表符号 */
      /* list-style-type: none; */
      /* 自定义列表符号，可以选择一张图片 */
      /* list-style-image: url(./icon.png); */
      /* list-style是列表样式的缩写属性，既可以设置列表符号，也可以设置列表图标 */
      /* list-style: none; */
      list-style: url(./icon.png);
    }
  </style>
</head>
<body>
  <ul>
    <li>北京</li>
    <li>济南</li>
    <li>南京</li>
    <li>合肥</li>
  </ul>
  <ol>
    <li>小米</li>
    <li>理想</li>
    <li>问界</li>
    <li>蔚来</li>
  </ol>
</body>
</html>
