<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超链接样式设置</title>
  <style>
    /* 
      通常情况下我们会给a标签整体设置一个样式，然后再添加一个鼠标悬停样式
    */
    a{
      color: #333;
      font-size: 20px;
      text-decoration: none;
    }
    a:hover{
      color: #999;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <a href="#">超链接样式设置</a>
</body>
</html>
