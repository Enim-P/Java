<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定义列表</title>
</head>
<body>
  <!-- dl是定义列表标签，dt是定义列表的标题标签，dd是定义列表的描述标签，
   就是用dd去描述dt，一个dt可以由多个dd描述，
   一个dl中还可以定义多个dt -->
  <dl>
    <dt>咖啡</dt>
    <dd>咖啡是一种热饮料，原产地是巴西，由葡萄牙人带到欧洲，并成为全球性的饮料...</dd>
  </dl>
  <dl>
    <dt>热门旅游城市</dt>
    <dd>三亚</dd>
    <dd>厦门</dd>
    <dd>青岛</dd>
    <dd>大连</dd>
  </dl>
  <dl>
    <dt>手机</dt>
    <dd>苹果手机</dd>
    <dd>华为手机</dd>
    <dd>小米手机</dd>
    <dd>三星手机</dd>
    <dt>家电</dt>
    <dd>电视机</dd>
    <dd>洗衣机</dd>
    <dd>电冰箱</dd>
    <dd>空调</dd>
    <dt>家具</dt>
    <dd>餐桌</dd>
    <dd>沙发</dd>
    <dd>茶几</dd>
    <dd>电视柜</dd>
  </dl>
</body>
</html>
