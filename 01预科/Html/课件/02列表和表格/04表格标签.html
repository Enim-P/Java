<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表格标签</title>
</head>
<body>
  <!-- table是表格标签，tr是行标签，td是列标签 -->
  <table border="1" width="200" height="200">
    <tr>
      <td>张三</td>
      <td>李四</td>
      <td>王五</td>
    </tr>
    <tr>
      <td>小明</td>
      <td>小强</td>
      <td>小芳</td>
    </tr>
    <tr>
      <td>小李</td>
      <td>老王</td>
      <td>张哥</td>
    </tr>
  </table>
  <hr>
  <!-- th是表头列标签，跟td的区别是，th默认会加粗并且居中 -->
  <table border="1" width="300">
    <tr>
      <th>姓名</th>
      <th>性别</th>
      <th>年龄</th>
      <th>职业</th>
    </tr>
    <tr>
      <td>张三</td>
      <td>男</td>
      <td>25</td>
      <td>后端开发</td>
    </tr>
    <tr>
      <td>李四</td>
      <td>女</td>
      <td>26</td>
      <td>前端开发</td>
    </tr>
  </table>
</body>
</html>
