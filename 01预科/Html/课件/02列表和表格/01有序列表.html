<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>有序列表</title>
</head>
<body>
  <!-- ol是有序列表标签,li是列表项标签 -->
  <h3>今天特价水果</h3>
  <ol>
    <li>苹果</li>
    <li>普通</li>
    <li>西瓜</li>
    <li>草莓</li>
  </ol>
  <h3>热门旅游城市</h3>
  <!-- 通过type属性设置有序列表的序号，属性值包括：A a I i -->
  <ol type="A">
    <li>北京</li>
    <li>上海</li>
    <li>重庆</li>
    <li>成都</li>
  </ol>
</body>
</html>
