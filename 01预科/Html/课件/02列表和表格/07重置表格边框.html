<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置表格边框</title>
  <!-- style标签用于定义内部样式 -->
  <style>
    /* 标签选择器：根据标签的名字给标签定义样式 */
    table{
      /* 取消表格中单元格间隙 */
      border-collapse: collapse;
    }
  </style>
</head>
<body>
  <table border="1" width="200" height="200">
    <tr>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td></td>
      <td></td>
      <td></td>
    </tr>
  </table>
</body>
</html>
