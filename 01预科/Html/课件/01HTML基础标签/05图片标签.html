<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片标签</title>
</head>
<body>
  <!-- img是图片标签
    src属性设置图片地址，地址可以是本地地址，也可以是网络地址
    width属性设置图片宽度，height属性设置图片高度
    注意：同时设置宽高属性可能会导致图片失真，所以通常宽高只设置一个属性，另一个会自适应
    alt属性设置图片的替代文字，在图片无法打开时显示文字
    title属性设置鼠标悬停提示信息
  -->
  <img src="./cat.webp" alt="小猫咪" title="酷酷的小猫"/>
  <img src="./cat2.webp" alt="小猫咪"/>
  <hr>
  <img width="200" height="200" src="https://gimg2.baidu.com/image_search/src=http%3A%2F%2Fci.xiaohongshu.com%2F1000g0081nvct950d606g4btlbg2ob1q6hu952k8%3FimageView2%2F2%2Fw%2F1080%2Fformat%2Fjpg&refer=http%3A%2F%2Fci.xiaohongshu.com&app=2002&size=f9999,10000&q=a80&n=0&g=0n&fmt=auto?sec=1755663527&t=c03841926189f92e804b853d29405804"/>
</body>
</html>
