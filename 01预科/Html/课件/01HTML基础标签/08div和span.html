<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>div和span</title>
</head>
<body>
  <!-- div:分区标签，常用于布局，
   div是块级标签，块级标签的特点是独占一行 -->
  <div>杭州</div>
  <div>南京</div>
  <div>合肥</div>
  <hr>
  <!-- span:范围标签，常用于对内容的局部修饰，
   span是行级标签，行级标签的特点是按行挨个显示 -->
  <span>长沙</span>
  <span>武汉</span>
  <span>成都</span>
  <!-- 通过情况下，行级标签都是用在块级标签的里面，对某一个部分内容进行修饰 -->
  <div>今天的<span style="color: red;">天气非常好</span>，比较适合出去玩。</div>
</body>
</html>
