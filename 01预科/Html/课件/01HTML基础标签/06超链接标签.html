<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超链接标签</title>
</head>
<body>
  <!-- a标签是超链接标签，用于跳转页面，可以是本地页面，也可以是网络页面
   href属性设置跳转路径
   target属性设置目标页面的打开方式，属性值_blank打开新窗口，_self是替换自身窗口 -->
  <a href="./05图片标签.html" target="_blank">查看图片标签</a>
  <a href="./05图片标签.html" target="_self">查看图片标签</a>
  <hr>
  <a href="https://www.baidu.com" target="_blank">百度</a>
  <!-- 这个是超链接的第一种用法：页面间链接，从一个页面跳转到另一个页面 -->
</body>
</html>
