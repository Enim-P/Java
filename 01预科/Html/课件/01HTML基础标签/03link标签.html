<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>link标签</title>
  <!-- link标签，用于引入网页的外部资源，
   通常会使用它引入外部的样式文件，网页的图标文件，
   rel属性设置资源类型，属性值icon表示资源类型是图标
   href属性设资源路径，./是当前路径 -->
  <link rel="icon" href="./my.ico">
</head>
<body>
  这里我们使用link标签引入网页的图标文件
</body>
</html>
