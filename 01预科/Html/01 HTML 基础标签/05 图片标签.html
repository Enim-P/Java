<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片标签</title>
</head>
<body>
  <!-- img是图片标签
   src 属性设置图片地址，地址可以是本地地址，也可以是网络地址
   width属性设置图片宽度， heigh属性设置图片失真 
   注意： 同时设置宽高属性可能会失真，所以宽高只设置一个属性另一个会自适应
   alt属性设置图片的替代文字，在图片无法打开时显示文字
   title属性设置鼠标悬停提示信息-->
  <img src = "./cat.jpg" alt = "小猫咪" title = "酷酷的小猫"/>
  <hr/>
   <img width = "200" height = "200" src = 
   "https://ts1.tc.mm.bing.net/th/id/R-C.2529dccabd823710a01ec591a74ec303?rik=ubSImBtBgcSNdQ&riu=http%3a%2f%2finews.gtimg.com%2fnewsapp_match%2f0%2f15648807974%2f0&ehk=5%2bWW5HZrokJYBFtiB2Kd2qWNaNB1oFOn1xHT69ZQpzI%3d&risl=&pid=ImgRaw&r=0"
   alt = "Apex Legends" title = "Apex Legends"
   />
</body>
</html>
