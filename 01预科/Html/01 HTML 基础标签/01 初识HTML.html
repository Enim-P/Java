
<!--html:超文本框表记语言（）
超文本：指的是不仅仅是普通文本，也包括图片，音频，视频等媒体资源
标记：指的每个超文本内容都是以标签的形式定义的。
html文件的扩展名是.html 或 .html (通常都是以.html定义)
html是网页的根标签
-->
<!--通常情况下网页的最上方会有一个文档声明<!DOCTYPE html>
文档声明的意义在于告诉浏览器当前网页开发的标准是HTML5的标准
DOCTYPE html> 声明这是执行HTML5的标准
-->
<!DOCTYPE html>
<html>
  <!-- html包含两个子标签
       head:头部标签，用于定义网页的资源信息，比如从外部引入样式资源
       body:主体标签，网页中展示的所有内容都是定义在body中的  
  -->
  
  
  <head>
    <!-- title定义网页的标题，网页标题的内容在浏览器选项卡中显示 -->
     <title>我的第一个网页</title>
  </head>
  <body>
    Hello HTML!!!
  </body>
</html>

<!--网页是在浏览器中运行的，浏览器在这里充当什么角色？
网页.html  需要借助浏览器运行    浏览器就是.html文件的解码器
音乐.mp3   需要借助播放器播放    播放器就是,mp3文件的解码器
既然浏览器是.HTML文件的解码器，那么我们使用哪一种浏览器？
这里首选谷歌的Chrome浏览器，因为他是解析能力最强的解码器
