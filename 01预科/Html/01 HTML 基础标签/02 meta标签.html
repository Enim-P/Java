<!-- 在vscode快速深层网页的快捷键是 ‘ ！ + 回车 ’ -->
<!DOCTYPE html>
<html>
<head>
    <!-- meta是元数据标签，元数据不会再页面上显示，用与给浏览器理解 
     通常会设置页面的字符编码，搜索关键词，页面描述，定时刷新页面，移动设备设置等等-->
     <!-- 设置当前网页的字符编码为UTF-8，UTF-8 又简称万国码（是将全世界使用的所有字符编成的编码） -->
    <meta charset="UTF-8">
    <!-- 适配移动端设备 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 设置当前网页的搜索关键词 , 方便你的网站在各大搜索引擎中搜索到-->
    <meat name = "keywords" content = "旅游，南京旅游，华东旅游，酒店预订，机票预订">
    <!-- 设置网页的描述信息，介绍一下网站的具体内容，也方便搜索引擎搜索 -->
    <meta name = "description" content = "携程旅行网是中国领先的在线旅行服务公司">
    <!-- 设置网页指定的时间后刷新 -->
    <meta http-equiv="refresh" content = "60">
    <title>meta标签</title>
</head>
<body>
    携程旅游网
</body>
</html>
