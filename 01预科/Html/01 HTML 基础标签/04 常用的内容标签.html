<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 注意：title是网页的标题 ，在浏览器选项卡中显示-->
    <title>常用的内容标签</title>
</head>
<!-- 所有的内容标签都要放置在body -->
<body>
    <!-- 标题标签，这里的标题是内容标签，有6个从h1到h6字体大小在递减，
     标题标签的特点是字体加粗 -->
        <h1>一级标题</h1>
        <h2>二级标题</h2>
        <h3>三级标题</h3>
        <h4>四级标题</h4>
        <h5>五级标题</h5>
        <h6>六级标题</h6>
    <!-- p标签是段落标签，一段内容通常都需要使用P标签进行包裹 -->
    <p>
        好好学习，天天向上。
    </p>

    <!-- hr是水平线标签 -->
        <hr>
    <!-- br 是换行标签 -->

    <p>
        好好学习，
        <br>
        天天向上
    </p>
    <!-- hr和br是单标签，h1和p是双标签
    单标签有两种写法：<br> <br/> ,第二种写法更加的规范 -->
        <hr>

    <!-- strong是加粗标签，em是倾斜标签 -->
    <p> 
        <strong>今天是 2025年7月21日</strong> <em>星期一</em> 
    </p>

        <hr>

    <!-- 注意：在网页不管打多少空格，默认都是一个空格
         如果需要输出多个空格，需要使用特殊符号：&nbsp; -->
    <p>
        好好学习&nbsp;&nbsp;&nbsp;&nbsp;天天向上
    </p>

    <!-- 在网页中任何<XXX>都是标签，标签是不会直接显示，
            如果要输出 < 使用 &lt; 如果要使用 > 使用 &gt; -->
    <p>
        这段时间我们要学习&lt;html&gt;
                
    </p>

    <!-- &copy; 是版权符号 -->
    <p>
        华为公司版权所有 &copy; 2026
    </p>

    <!-- &quot; 是双引号 -->
<p>
     &quot; 我会好好学习的 &quot; 
</p>

</body>
</html>
