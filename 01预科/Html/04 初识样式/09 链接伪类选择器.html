<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>链接伪类选择器</title>
  <style>
    /* .是类选择器，：是伪类选择器 */
    /* :visited表示点击过后的状态 */
    a{
/* 去除超链接的下划线 */
      text-decoration: none;
    }
    a:visited{
      color:green;
    } 
      /* :link表示未点击状态 */
    a:link{
      color:black;
       }
    /* :hover 表示鼠标悬停状态 */
    a:hover{
          color:orange;
        }
    /* active表示点击未释放，就是点击一瞬间的样式 */
    a:active{
      color:darkred;
      font-size: 30px;
    }
    /* 
    通常情况下我们会给a标签整体设置一个样式，然后再添加一个鼠标悬停样式
    */   
  </style>
</head>
<body>
  <!-- href ="#" 表示锚链接跳转到页面的最上方，这里可以当作空使用 -->
  <a href = "#">打开行内样式</a>
  <a href = "javascript:void(0)">空链接</a>
  <hr/>
</body>
</html>
