<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行内样式</title>
</head>
<body>
  <P style = "color:red; font-size:30px;">苹果</P>
  <P>西瓜</P>
  <P>葡萄</P>
  <!-- 在元素的身上直接通过style属性定义样式，这样的样式就称之为:行内样式 -->
  <P style = "color: red; font-size: 30px;">荔枝</P>
  <!-- 如果有多个元素需要使用相同的样式，行内样式需要重复定义
   所以行内样式的复用性是最差的 -->
</body>
</html>
